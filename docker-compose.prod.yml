# Продакшен-настройки поверх docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Секреты берутся из файла .env рядом (не хранится в git):
#   POSTGRES_PASSWORD=...   PUBLIC_URL=https://coin.edudev.kz
#   ADMIN_PASSWORD=...      (вход в админку /api/admin/)
#   TELEGRAM_BOT_TOKEN=...  TELEGRAM_ADMIN_CHAT=...   (бот: вход, уведомления, оплата Pro звёздами, копии базы)
#   PRO_STARS=950  PRO_DAYS=365                         (необязательно: цена и срок Pro)
#   OPENAI_API_KEY=...                                  (необязательно: ключ ИИ)
# Наружу смотрит только caddy (80/443): HTTPS, приложение, API по /api,
# установочные файлы по /download.

# Журналы контейнеров без ограничения росли бы, пока не займут диск: храним
# до 3 файлов по 10 МБ на сервис.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *logging
    # Настройки под 8 ГБ памяти сервера (общего с другим проектом) и разбор
    # медленных запросов: всё, что дольше 0,5 с или ждало блокировку, — в журнал.
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c work_mem=8MB
      -c max_connections=100
      -c checkpoint_completion_target=0.9
      -c log_min_duration_statement=500
      -c log_lock_waits=on
      -c deadlock_timeout=2s
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    ports: !override []
    restart: unless-stopped

  api:
    logging: *logging
    # Потолок памяти: утечка в API не должна съесть сервер, общий с другим
    # проектом, — контейнер перезапустится сам (restart: unless-stopped).
    mem_limit: 1g
    environment:
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ORIGIN: ${PUBLIC_URL:?задайте PUBLIC_URL в .env}
      # Оплата Pro звёздами Telegram: цена и срок (по умолчанию 950 ⭐ на 365 дней).
      PRO_STARS: ${PRO_STARS:-950}
      PRO_DAYS: ${PRO_DAYS:-365}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Ключ поставщика ИИ: распознавание голосовых в боте, консультант.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports: !override []
    restart: unless-stopped

  web:
    logging: *logging
    mem_limit: 256m
    build:
      args:
        API_URL: ${PUBLIC_URL}/api
    ports: !override []
    restart: unless-stopped

  caddy:
    logging: *logging
    image: caddy:2-alpine
    depends_on:
      - web
    environment:
      # Домен без схемы: https://coin.edudev.kz → coin.edudev.kz
      DOMAIN: ${DOMAIN:-coin.edudev.kz}
      SERVER_IP: ${SERVER_IP:-95.216.145.108}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist:/srv/dist:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
