# Проверки на каждый пуш: тесты ядра, сервера и приложения, а затем сервер с
# настоящей базой — параллельные запросы, повторы и небольшая нагрузка.
# Именно здесь ловятся ошибки, которые юнит-тесты не видят: гонки при
# одновременных командах и «зависание» приложения при пачке входов.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0' # как в app/Dockerfile
          cache: true
      - name: Ядро
        run: cd packages/famcoin_core && dart pub get && dart analyze && dart test
      # pdftotext читает PDF-выписку банка: тест прогоняет через него настоящий PDF.
      - name: Чтение PDF
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Сервер
        env:
          TEST_PDFTOTEXT_REQUIRED: '1'
        run: cd server && dart pub get && dart analyze && dart test
      - name: Приложение
        run: cd app && flutter pub get && flutter analyze lib test && flutter test
      - name: Web Push — разрешение и восстановление подписки
        run: node --test app/test_web/push_test.cjs

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Сервер и база
        run: docker compose up -d --build db api
      - name: Ждём, пока API ответит
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/health && exit 0
            sleep 2
          done
          docker compose logs api
          exit 1
      - uses: dart-lang/setup-dart@v1
      # Все тесты, которым нужна база: вход через Telegram, напоминания, бот,
      # консультант, импорт выписки и виды справочников (ограничение таблицы
      # против списка в коде).
      - name: Тесты сервера на настоящей базе
        env:
          TEST_DB_REQUIRED: '1'
        run: cd server && dart pub get && dart test test/telegram_login_db_test.dart test/month_nudge_db_test.dart test/chat_entry_db_test.dart test/ai_db_test.dart test/entity_kinds_db_test.dart test/statement_import_db_test.dart
      # Сервер при старте читает свой проверочный PDF: в образе должен быть
      # pdftotext, и запускаться он должен без прав и с потолком памяти.
      - name: Чтение PDF в образе сервера
        run: |
          docker compose logs api | grep 'import: чтение PDF-выписок — pdftotext, без прав, с потолком памяти и времени' && exit 0
          docker compose logs api | grep 'import:'
          exit 1
      - name: Параллельные запросы и повторы
        run: python3 deploy/concurrency_check.py
      - name: Нагрузка (100 пользователей, шторм входов)
        run: python3 deploy/loadtest.py --users 100 --heavy 1 --heavy-tx 1000 --workers 30 --check
      - name: Журнал сервера при сбое
        if: failure()
        run: docker compose logs api db | tail -200
