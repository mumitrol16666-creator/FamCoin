<link rel="stylesheet" href="story.css">
<style>
  :root { --dur: 15s; }
  .months { position: absolute; left: 120px; right: 120px; top: 1000px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
  .mo { height: 190px; border-radius: 32px; border: 3px solid rgba(127,216,180,.45); position: relative; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 18px; font-size: 34px; font-weight: 700; color: var(--text2); }
  .mo::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 100%; background: linear-gradient(180deg, #2f9a72, #1f5e4f); z-index: -1; animation: growH .7s cubic-bezier(.2,.7,.2,1) both; animation-delay: var(--d); }
  .mo.opt::before { background: rgba(127,216,180,.18); }
  .mo span { position: relative; color: #fff; }
  .one { animation: pulse 1.4s ease-in-out 5.2s 2 both; }
  @keyframes pulse { 0%,100% { box-shadow: none; } 50% { box-shadow: 0 0 60px rgba(230,170,60,.7); border-color: var(--gold); } }
</style>
</head>
<body>
<div class="stage"><div class="cam">

  </div></div>
  <div class="end" data-show="12.6">
    <img src="../../app/web/icons/Icon-512.png" alt="">
    <div class="name">FamCoin</div>

    <div class="pill">coin.edudev.kz</div>
    <div class="tg">Telegram: @Famcoin01_bot</div>
  </div>
  <div class="vignette"></div><div class="grain"></div>
