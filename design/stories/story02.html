<link rel="stylesheet" href="story.css">
<style>

  .bars { position: absolute; left: 110px; right: 110px; top: 980px; }
  .bar3 { margin-bottom: 34px; }

  .bar3 .lab b { font-size: 46px; }
  .bar3 .tr { height: 46px; border-radius: 24px; background: rgba(255,255,255,.07); overflow: hidden; }
  .bar3 .tr i { display: block; height: 100%; border-radius: 24px; animation: grow 1.1s cubic-bezier(.2,.7,.2,1) both; }
  .head50 { position: absolute; left: 0; right: 0; top: 560px; text-align: center; font-size: 190px; font-weight: 800; letter-spacing: -6px; }
  .head50 .sl { color: var(--text2); font-weight: 600; padding: 0 .1em; }
</style>
</head>
<body>
<div class="stage"><div class="cam">

  <div class="head50" data-show="0.3,4.8"><span style="color:var(--mint)">50</span><span class="sl">/</span><span style="color:var(--gold)">30</span><span class="sl">/</span><span>20</span></div>
  <div class="bars" data-show="1.0,4.8">
    <div class="bar3"><div class="lab"><span>Обязательное</span><b style="color:var(--mint)">50%</b></div><div class="tr"><i style="width:100%;background:var(--mint);animation-delay:1.3s"></i></div></div>
    <div class="bar3"><div class="lab"><span>Желания</span><b style="color:var(--gold)">30%</b></div><div class="tr"><i style="width:60%;background:var(--gold);animation-delay:2.2s"></i></div></div>
    <div class="bar3"><div class="lab"><span>Будущее</span><b>20%</b></div><div class="tr"><i style="width:40%;background:#f2f4f6;animation-delay:3.1s"></i></div></div>
  </div>
  <div class="line mid" style="top:760px" data-words data-in="5.0" data-out="7.6" data-accent="ориентир">Это ориентир, а&nbsp;не&nbsp;закон</div>

  <div class="cap" data-words data-in="8.05" data-out="12.4" data-stagger="0.08" data-accent="легко">Проверить себя легко</div>
  <div class="persp"><div class="phone" data-show="7.8,12.4" data-anim="phoneIn">

    <div class="pcard">

      <div class="prow"><span>Обязательные</span><b style="color:var(--mint)">48%</b></div><div class="pbar"><i style="width:48%;background:var(--mint);animation:grow 1s ease 8.9s both"></i></div>
      <div class="prow"><span>Обычные</span><b style="color:var(--gold)">33%</b></div><div class="pbar"><i style="width:33%;animation:grow 1s ease 9.3s both"></i></div>
      <div class="prow"><span>Свободные</span><b>19%</b></div><div class="pbar"><i style="width:19%;background:#f2f4f6;animation:grow 1s ease 9.7s both"></i></div>
    </div>
  </div></div>
  <div class="end" data-show="12.6">
    <img src="../../app/web/icons/Icon-512.png" alt="">
    <div class="name">FamCoin</div>
    <div class="tag">Деньги под контролем</div>
    <div class="pill">coin.edudev.kz</div>
    <div class="tg">Telegram: @Famcoin01_bot</div>
  </div>
  <div class="vignette"></div><div class="grain"></div>
