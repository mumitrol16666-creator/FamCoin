server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API за тем же адресом: браузеру не нужен отдельный порт и CORS.
  # В контейнере web имя `api` резолвится через сеть docker compose.
  location /api/ {
    proxy_pass http://api:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
  }

  # Движок и шрифты не меняются между сборками приложения — кешируем.
  location ~ ^/(canvaskit|icons)/ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
  location ~ ^/assets/fonts/ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # Всё остальное — main.dart.js, загрузчик, манифесты, ассеты — без хеша
  # в имени и меняется при каждой сборке: браузер обязан перепроверять
  # (ETag), иначе телефон неделю показывает старую версию.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
  gzip_min_length 1024;
}
