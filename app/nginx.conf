# Ограничения запросов (защита от перебора и «залипших» клиентов).
# Перед nginx стоит Caddy: настоящий адрес клиента приходит в X-Forwarded-For,
# и верим ему только от адресов внутренней сети docker.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Вход, регистрация и смена пароля считаются в базе через bcrypt (десятки
# миллисекунд процессора каждая), поэтому для них лимит жёстче общего.
# Остальные адреса получают пустой ключ — для них этот лимит не действует.
map $uri $bcrypt_key {
  default "";
  ~^/api/auth/(login|register|password)$ $binary_remote_addr;
}
limit_req_zone $bcrypt_key zone=bcrypt:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Медленные и недосланные запросы не должны держать соединения.
  client_header_timeout 15s;
  client_body_timeout 15s;
  send_timeout 30s;
  keepalive_timeout 30s;

  # API за тем же адресом: браузеру не нужен отдельный порт и CORS.
  # В контейнере web имя `api` резолвится через сеть docker compose.
  location /api/ {
    limit_req zone=bcrypt burst=20 nodelay;
    limit_req zone=api burst=100 nodelay;
    proxy_pass http://api:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    # Чуть больше, чем ждёт API (30 с): клиент получает его ответ, а не обрыв.
    proxy_read_timeout 35s;
    client_max_body_size 1m;
  }

  # Ответ на превышение лимита в том же формате, что и остальные ошибки API.
  error_page 429 = @limited;
  location @limited {
    default_type application/json;
    add_header Retry-After 10 always;
    return 429 '{"error":"rate_limited","retryAfterSeconds":10}';
  }

  # Значки для экрана «Домой» не меняются между сборками — кешируем.
  # Шрифт иконок (assets/fonts/MaterialIcons-Regular.otf) сюда не входит:
  # сборка обрезает его до набора иконок именно этой версии, а адрес файла
  # прежний. С кешем на неделю Safari на iPhone держал старый шрифт, и новые
  # иконки рисовались пустыми (D99). Движок canvaskit/ тоже без долгого кеша:
  # его файлы меняются при обновлении Flutter SDK, а имена — нет.
  location ~ ^/icons/ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # Wasm-сборка подключает main.dart.mjs как ES-модуль. В стандартной таблице
  # MIME nginx расширения .mjs нет: файл уходил как application/octet-stream,
  # браузер отклонял модуль и показывал пустой экран (аудит 28.09.2026, F01).
  location ~ \.mjs$ {
    types { }
    default_type application/javascript;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    try_files $uri =404;
  }

  # Всё остальное — main.dart.js, загрузчик, манифесты, ассеты — без хеша
  # в имени и меняется при каждой сборке: браузер обязан перепроверять
  # (ETag), иначе телефон неделю показывает старую версию.
  location / {
    add_header Cache-Control "no-cache";
    # Изоляция источника (D51): включает многопоточный skwasm — без нужного
    # заголовка Flutter молча откатывается на однопоточный режим (медленнее
    # при прокрутке). Google Fonts уже отдаёт cross-origin-resource-policy —
    # проверено, шрифты под этим заголовком не ломаются. Подресурсы того же
    # origin (canvaskit, .mjs, ассеты) заголовка не требуют — он важен только
    # на самом документе.
    add_header Cross-Origin-Opener-Policy "same-origin";
    add_header Cross-Origin-Embedder-Policy "require-corp";
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
  gzip_min_length 1024;
}
