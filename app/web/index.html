  <style>
    /* Заставка на время загрузки (D104): iPhone выгружает сайт из памяти в
       фоне, и при возврате он стартует заново — вместо белого экрана логотип
       и индикатор в цветах приложения. Прячется по первому кадру Flutter. */
    html, body { background: #F1F7EC; margin: 0; }
    @media (prefers-color-scheme: dark) { html, body { background: #101F19; } }
    #famcoin-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; background: #F1F7EC; z-index: 9999; padding: 24px; text-align: center;
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; color: #0D7050; }
    @media (prefers-color-scheme: dark) { #famcoin-splash { color: #88E4B6; background: #101F19; } }
    #famcoin-splash .logo { width: 72px; height: 72px; border-radius: 20px; background: #0D7050; color: #D6F584;
      display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 700; }
    #famcoin-splash .ring { width: 26px; height: 26px; border-radius: 50%; border: 3px solid currentColor;
      border-right-color: transparent; animation: famcoin-spin .9s linear infinite; opacity: .8; }
    @keyframes famcoin-spin { to { transform: rotate(360deg); } }
    #famcoin-splash[hidden], #famcoin-splash [hidden] { display: none; }
    #famcoin-startup-status { margin: 0; max-width: 320px; line-height: 1.5; }
    #famcoin-startup-retry { font: inherit; font-weight: 600; border: 0; border-radius: 14px;
      padding: 14px 22px; min-height: 48px; background: #0D7050; color: white; cursor: pointer; }
    #famcoin-startup-retry:focus-visible { outline: 3px solid currentColor; outline-offset: 4px; }
    @media (prefers-color-scheme: dark) { #famcoin-startup-retry { background: #88E4B6; color: #101F19; } }
    @media (prefers-reduced-motion: reduce) { #famcoin-splash .ring { animation: none; } }
  </style>
</head>
<body>
  <div id="famcoin-splash">
    <div class="logo" aria-hidden="true">₸</div>
    <div id="famcoin-startup-ring" class="ring" aria-hidden="true"></div>
    <p id="famcoin-startup-status" role="status" aria-live="polite">Открываем FamCoin…</p>
    <button id="famcoin-startup-retry" type="button" hidden>Открыть снова</button>
    <noscript>Для работы FamCoin включите JavaScript в настройках браузера.</noscript>
  </div>
  <script>
    // Этот экран работает даже при сбое загрузчика, движка или настроек Dart.
    // Заставку сохраняем в DOM: если iOS выгрузит слой приложения, можно
    // показать восстановление без Flutter и без бесконечных перезагрузок.
    (function () {
      var splash = document.getElementById('famcoin-splash');
      var status = document.getElementById('famcoin-startup-status');
      var ring = document.getElementById('famcoin-startup-ring');
      var retry = document.getElementById('famcoin-startup-retry');
      var kk = false;
      try { kk = JSON.parse(localStorage.getItem('flutter.lang')) === 'kk'; } catch (_) {}
      status.textContent = kk ? 'FamCoin ашылуда…' : 'Открываем FamCoin…';
      retry.textContent = kk ? 'Қайта ашу' : 'Открыть снова';
      var ready = false;
      var timer = setTimeout(function () { if (!ready) fail(true); }, 25000);
      function fail(slow) {
        clearTimeout(timer);
        splash.hidden = false;
        ring.hidden = true;
        retry.hidden = false;
        status.textContent = slow
          ? (kk ? 'Жүктеу ұзаққа созылды. Интернетті тексеріңіз немесе қайта ашыңыз.' : 'Загрузка затянулась. Проверьте интернет или откройте приложение снова.')
          : (kk ? 'FamCoin ашылмады. Интернетті тексеріп, қайталап көріңіз.' : 'Не удалось открыть FamCoin. Проверьте интернет и попробуйте снова.');
      }
      window.famcoinStartup = { fail: function () { if (!ready) fail(false); } };
      retry.addEventListener('click', function () { window.location.reload(); });
      window.addEventListener('flutter-first-frame', function () {
        ready = true;
        clearTimeout(timer);
        splash.hidden = true;
      });
      // В режиме JS ошибка загрузки main.dart.js не отклоняет Promise
      // FlutterLoader с callback. Перехватываем и сетевую ошибку тега script.
      window.addEventListener('error', function (event) {
        if (!ready && (event.error || (event.target && event.target.tagName === 'SCRIPT'))) fail(false);
      }, true);
      window.addEventListener('unhandledrejection', function () { if (!ready) fail(false); });
      var resumeTimer;
      document.addEventListener('visibilitychange', function () {
        clearTimeout(resumeTimer);
        if (document.visibilityState !== 'visible' || !ready) return;
        resumeTimer = setTimeout(function () {
          if (!document.querySelector('flutter-view')) fail(false);
        }, 3000);
      });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Старые установки: снимаем service worker прежних сборок, иначе он
    // продолжит отдавать закешированную версию. Наш push-sw.js только
    // принимает уведомления и ничего не кеширует — его оставляем.
    if (navigator.serviceWorker) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) {
          var url = (r.active || r.waiting || r.installing || {}).scriptURL || '';
          if (url.indexOf('push-sw.js') < 0) r.unregister();
        });
        if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
      });
    }
  </script>
  <script>
    // Push-уведомления (Web Push). На iPhone работают только у сайта,
    // добавленного на экран «Домой», и только после нажатия кнопки.
    // Проверка обновлений (D103): приложение просит перезагрузить страницу,
    // когда на сервере новая сборка.
    window.famcoinReload = function () { window.location.reload(); };
    window.famcoinPush = {
      _ios: function () {
        return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      },
      _standalone: function () {
        return window.navigator.standalone === true ||
          (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
      },
      _reg: function () {
        return navigator.serviceWorker.register('push-sw.js').then(function () {
          return navigator.serviceWorker.ready;
        });
      },
      requestPermission: function () {
        if (this._ios() && !this._standalone()) return Promise.resolve('needs-install');
        if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
          return Promise.resolve('unsupported');
        }
        if (Notification.permission !== 'default') return Promise.resolve(Notification.permission);
        // Синхронно внутри нажатия: сетевой запрос до этого теряет user activation в Safari.
        return Notification.requestPermission();
      },
      confirmEnabled: function () {
        localStorage.removeItem('famcoin.push.pending');
      },
      // unsupported | needs-install | denied | off | on
      status: function () {
        if (this._ios() && !this._standalone()) return Promise.resolve('needs-install');
        if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
          return Promise.resolve('unsupported');
        }
        if (Notification.permission === 'denied') return Promise.resolve('denied');
        return this._reg().then(function (reg) { return reg.pushManager.getSubscription(); })
          .then(function (sub) {
            return sub && Notification.permission === 'granted' && !localStorage.getItem('famcoin.push.pending') ? 'on' : 'off';
          });
      },
      // Возвращает JSON подписки: {endpoint, p256dh, auth}; '' — разрешение не дано.
      enable: function (key) {
        var self = this;
        if (!('Notification' in window) || Notification.permission !== 'granted') return Promise.resolve('');
        // Локальная подписка ещё не означает, что сервер её сохранил.
        // После ошибки или перезагрузки оставляем возможность повторить.
        localStorage.setItem('famcoin.push.pending', '1');
        return self._reg().then(function (reg) {
            return reg.pushManager.getSubscription().then(function (old) {
              if (old) return old;
              var pad = '='.repeat((4 - key.length % 4) % 4);
              var raw = atob((key + pad).replace(/-/g, '+').replace(/_/g, '/'));
              var bytes = new Uint8Array(raw.length);
              for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
              return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: bytes });
            });
        }).then(function (sub) {
          if (!sub) return '';
          var j = sub.toJSON();
          return JSON.stringify({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth });
        });
      },
      // Возвращает адрес отменённой подписки или ''.
      disable: function () {
        return this._reg().then(function (reg) { return reg.pushManager.getSubscription(); })
          .then(function (sub) {
            if (!sub) return '';
            var endpoint = sub.endpoint;
            return sub.unsubscribe().then(function () { return endpoint; });
          });
      }
    };
  </script>
  <script>
    // Safari на iOS 26: после клавиатуры визуальная область (visualViewport)
    // не совпадает со слоем, где нарисован интерфейс, — нажатия попадают
    // выше кнопок. Когда клавиатура закрыта, возвращаем страницу в начало и
    // заставляем Safari заново разместить фиксированный слой приложения.
    (function () {
      var vv = window.visualViewport;
      function keyboardClosed() {
        return !vv || window.innerHeight - vv.height < 100;
      }
      function realign() {
        if (!keyboardClosed()) return;
        if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
        var body = document.body;
        if (!body) return;
        body.style.transform = 'translateZ(0)';
        requestAnimationFrame(function () {
          body.style.transform = '';
          window.dispatchEvent(new Event('resize'));
        });
      }
      function later() {
        setTimeout(realign, 50);
        setTimeout(realign, 400);
      }
      document.addEventListener('focusout', later, true);
      window.addEventListener('orientationchange', later);
      if (vv) {
        vv.addEventListener('resize', realign);
        vv.addEventListener('scroll', realign);
      }
      // Известный обход Safari: без слушателя touchstart часть касаний теряется.
      document.addEventListener('touchstart', function () {}, { passive: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
